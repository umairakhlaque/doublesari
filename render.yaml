services:
  - type: web
    name: doublesari-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT automatically — do not override it here.
      # Set CLIENT_URL to your Vercel frontend URL once it is deployed,
      # e.g. https://doublesari.vercel.app
      # Use * to allow all origins temporarily.
      - key: CLIENT_URL
        value: "*"
