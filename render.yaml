# Render Blueprint — deploys the backend as a persistent web service.
# https://render.com/docs/blueprint-spec
#
# Deploy steps:
#   1. Push this repo to GitHub.
#   2. Go to https://dashboard.render.com → New → Blueprint.
#   3. Connect your repo. Render reads this file automatically.
#   4. Set CLIENT_URL to your Vercel/Netlify frontend URL after deploying frontend.

services:
  - type: web
    name: doublesari-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Set CLIENT_URL to your deployed frontend URL, e.g.:
      #   https://doublesari.vercel.app
      # You can also add a wildcard:
      #   https://doublesari.vercel.app,https://*.vercel.app
      - key: CLIENT_URL
        sync: false   # fill this in Render dashboard after deploying frontend
